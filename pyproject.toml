[project]
name = "novel-assistant"
version = "0.1.0"
description = "AI-powered multi-agent novel writing assistant"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "gitpython>=3.1.0",
    "chardet>=5.0.0",
    "python-frontmatter>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
